<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>List your place · Spotted</title><meta name="description" content="Spotted: places worth staying in Abuja.">
<meta name="theme-color" content="#06402A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2306402A'/%3E%3Cpath fill-rule='evenodd' d='M32 8c-10 0-18 8-18 18 0 14 18 30 18 30s18-16 18-30c0-10-8-18-18-18zm0 12a6 6 0 1 1 0 12 6 6 0 0 1 0-12z' fill='%23F5480F'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css"></head>
<body><div id="hdr"></div>
<main class="wrap page" style="max-width:640px"><h2>List your place</h2><p class="muted" style="margin:6px 0 20px">Free for your first 2 months. Your place gets its own web address.</p><div id="claimnote"></div>
<form class="panel" id="f" novalidate><div class="field"><label for="name">Place name</label><input id="name" required placeholder="e.g. Garden Court Guest House"></div>
<div class="row"><div class="field"><label for="owner">Your name</label><input id="owner" required autocomplete="name"></div><div class="field"><label for="area">Area</label><input id="area" required placeholder="e.g. Jabi"></div></div>
<div class="field"><label for="email">Email</label><input id="email" type="email" required autocomplete="email"></div>
<div class="field"><label for="slug">Your web address</label><input id="slug" required autocomplete="off"><p class="muted" id="prev" aria-live="polite"></p></div>
<p id="err" role="alert" class="err"></p><button class="btn" type="submit">Create my listing</button></form></main>
<script src="js/app.js"></script><script src="js/signup.js"></script></body></html>
